[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-agent-mcp"
version = "0.2.0"
description = "Local authenticated MCP bridge to the open Anki app"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "anki==25.9.2", "aqt==25.9.2"]

[project.scripts]
anki-agent-mcp = "anki_agent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "addon"]
testpaths = ["tests"]
